name: MPR Issue Triage

on:
  issues:
    types:
      - opened

permissions:
  issues: write

jobs:
  triage:
    runs-on: ubuntu-latest

    steps:
      - name: Apply component labels
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const body = (issue.body || "").toLowerCase();
            const title = (issue.title || "").toLowerCase();

            const labels = [];

            if (
              body.includes("core/concurrency") ||
              body.includes("rate limiter") ||
              body.includes("rate limiting")
            ) {
              labels.push("component: backend-core");
            }

            if (
              body.includes("load shedding") ||
              body.includes("load shedder") ||
              body.includes("circuit breaker")
            ) {
              labels.push("component: resilience");
            }

            if (
              body.includes("rust") ||
              body.includes("eBPF".toLowerCase()) ||
              body.includes("xdp")
            ) {
              labels.push("component: systems");
            }

            if (title.includes("[bug]")) {
              labels.push("bug");
            }

            if (labels.length === 0) {
              labels.push("needs-triage");
            }

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              labels
            });