name: MPR Performance Benchmark

on:
  pull_request:
    branches:
      - main
    paths:
      - "core/**"
      - "experiments/**"
      - "telemetry/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/bench_bot.yml"

permissions:
  contents: read

jobs:
  performance-validation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate benchmark sources
        run: |
          python -m compileall core experiments telemetry tests

      - name: Run Python tests
        run: |
          pytest -q

      - name: Benchmark contract
        run: |
          echo "MPR Performance Benchmark: validation completed."
          echo "No synthetic latency values are reported."
          echo "Production latency measurements require a runnable HTTP target."